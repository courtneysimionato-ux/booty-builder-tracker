<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Booty Builder, Deep Core &amp; Swim Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#14131a;
  --surface:#1c1a24;
  --surface2:#242130;
  --border:#332f40;
  --text:#f2eef5;
  --text-dim:#a9a3b8;
  --text-faint:#726c82;
  --booty:#d6365f;
  --booty-soft:#3a1c26;
  --core:#3f9d8a;
  --core-soft:#183a34;
  --amber:#e0a458;
  --done:#6fcf97;
  --radius:10px;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
body{ padding-bottom:48px; }

h1,h2,h3,.daytitle,.phasefullname,.brand,.pill{ font-family:'Oswald',system-ui,sans-serif; }

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg); border-bottom:1px solid var(--border);
  padding:14px 16px 10px; display:flex; flex-direction:column; gap:10px;
}
.brand{ font-size:1.35rem; font-weight:700; letter-spacing:0.02em; }
.brand small{ display:block; font-family:'Inter'; font-weight:400; font-size:0.72rem; color:var(--text-faint); letter-spacing:0.04em; margin-top:2px; }

.section-toggle{ display:flex; gap:8px; }
.section-toggle button{
  flex:1; padding:10px 8px; border-radius:var(--radius); border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-family:'Oswald'; font-weight:600;
  font-size:0.92rem; letter-spacing:0.02em; cursor:pointer; transition:all .15s;
}
.section-toggle button.active[data-section="booty"]{ background:var(--booty); border-color:var(--booty); color:#fff; }
.section-toggle button.active[data-section="core"]{ background:var(--core); border-color:var(--core); color:#04120f; }

#app{ max-width:640px; margin:0 auto; padding:14px 14px 40px; }

.pillrow{ display:flex; gap:6px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none; }
.pillrow::-webkit-scrollbar{ display:none; }
.pill{
  flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-weight:600; font-size:0.85rem;
  cursor:pointer; white-space:nowrap;
}
.pill.active.booty{ background:var(--booty); border-color:var(--booty); color:#fff; }
.pill.active.core{ background:var(--core); border-color:var(--core); color:#04120f; }
.daypills{ margin-top:-4px; }

.phasefullname{ font-size:1.05rem; font-weight:600; margin:2px 2px 8px; color:var(--text); }
.phasefullname .secnote{ display:inline; font-family:'Inter'; }

.daycard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:6px; }
.dayhead{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.daytitle{ font-size:1.15rem; font-weight:600; }
.daysubtitle{ color:var(--text-dim); font-size:0.9rem; margin-top:2px; }

.donetoggle{ display:flex; align-items:center; gap:5px; font-size:0.78rem; color:var(--text-dim); white-space:nowrap; cursor:pointer; }
.donetoggle input{ width:18px; height:18px; accent-color:var(--done); }
.donepair{ display:flex; gap:12px; }

.seccard{ border-left:3px solid var(--border); padding:10px 12px; margin-bottom:10px; border-radius:0 8px 8px 0; background:var(--surface2); }
.sec-main{ border-left-color:var(--booty); }
.sec-pickone{ border-left-color:var(--amber); }
.sec-ref{ border-left-color:var(--text-faint); }
.seclabel{ font-family:'Oswald'; font-weight:600; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.reflist{ margin:0; padding-left:18px; color:var(--text); font-size:0.92rem; line-height:1.55; }
.secnote{ color:var(--text-faint); font-size:0.78rem; margin-top:6px; font-style:italic; }

.exlist{ display:flex; flex-direction:column; gap:10px; }
.exrow{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 10px; }
.exrow-noLog{ display:flex; justify-content:space-between; align-items:center; padding:6px 4px; background:none; border:none; }
.exrow-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.exname{ font-weight:600; font-size:0.94rem; flex:1; min-width:140px; }
.exreps{ color:var(--booty); font-weight:600; font-size:0.86rem; font-family:'Oswald'; }
.histbtn{ background:none; border:none; color:var(--text-faint); font-size:0.72rem; text-decoration:underline; cursor:pointer; padding:0; }
.exrow-bottom{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
.weightfield{ display:flex; align-items:center; gap:5px; }
.weightfield label{ font-family:'Oswald'; font-weight:700; font-size:0.72rem; color:var(--text-faint); background:var(--surface2); border:1px solid var(--border); border-radius:5px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.wInput{ width:64px; padding:6px 7px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9rem; }
.wInput:focus{ outline:2px solid var(--booty); border-color:var(--booty); }
.lasthint{ font-size:0.72rem; color:var(--text-faint); margin-top:6px; }
.histpanel{ margin-top:8px; }
.histtable{ width:100%; border-collapse:collapse; font-size:0.78rem; }
.histtable th,.histtable td{ text-align:left; padding:3px 6px; border-bottom:1px solid var(--border); color:var(--text-dim); }
.histtable th{ color:var(--text-faint); font-weight:600; }
.setstable{ width:100%; border-collapse:collapse; margin-top:8px; }
.setstable th{ font-family:'Oswald'; font-weight:700; font-size:0.72rem; color:var(--text-faint); text-align:left; padding:2px 6px; }
.setstable td{ padding:3px 6px; }
.setlabel{ font-size:0.78rem; color:var(--text-dim); white-space:nowrap; }
.setstable .wInput{ width:100%; min-width:56px; }
.loadingnote{ text-align:center; padding:40px 20px; color:var(--text-faint); font-family:'Oswald'; }
.syncbadge{ margin-top:14px; padding:8px 12px; border-radius:8px; font-size:0.78rem; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.syncok{ background:var(--core-soft); color:var(--core); }
.syncbad{ background:var(--booty-soft); color:#ff9eb0; }
.syncbadge button{ background:none; border:1px solid currentColor; color:inherit; border-radius:6px; padding:4px 8px; font-size:0.72rem; cursor:pointer; }

.pickrow{ display:flex; gap:6px; flex-wrap:wrap; }
.pickbtn{ padding:7px 12px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text-dim); font-size:0.82rem; cursor:pointer; }
.pickbtn.chosen{ background:var(--amber); border-color:var(--amber); color:#241a06; font-weight:600; }

.gridwrap{ margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; overflow-x:auto; }
.gridtitle{ font-family:'Oswald'; font-weight:600; font-size:0.85rem; color:var(--text-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.05em; }
.dcgrid{ border-collapse:collapse; width:100%; }
.dcgrid th{ font-size:0.72rem; color:var(--text-faint); font-weight:600; padding:4px; }
.dcgrid td{ text-align:center; padding:6px 4px; }
.wklabel{ font-family:'Oswald'; font-weight:600; color:var(--text-dim); font-size:0.8rem; text-align:left !important; white-space:nowrap; }
.gridpair{ display:flex; flex-direction:column; gap:3px; align-items:center; }
.gridlabel{ display:flex; align-items:center; gap:3px; font-size:0.62rem; color:var(--text-faint); font-family:'Oswald'; font-weight:600; cursor:pointer; }
.gridbox{ width:16px; height:16px; accent-color:var(--core); cursor:pointer; }

.blockswitch{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:0.82rem; color:var(--text-dim); }
.blockswitch select{ background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:0.82rem; }


.restpill{ opacity:0.55; }
.sec-optional{ border-left-style:dashed; opacity:0.92; }
.section-toggle{ gap:6px; }
.section-toggle button{ padding:10px 4px; font-size:0.84rem; }
.section-toggle button.active[data-section="drills"]{ background:var(--amber); border-color:var(--amber); color:#241a06; }
.drillgroup{ font-family:'Oswald'; font-weight:600; font-size:0.8rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); margin:16px 2px 6px; }
.drillcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; }
.drillcard summary{ list-style:none; cursor:pointer; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
.drillcard summary::-webkit-details-marker{ display:none; }
.drillcard summary::after{ content:"+"; position:absolute; right:30px; color:var(--text-faint); font-size:1.1rem; }
.drillcard[open] summary::after{ content:"–"; }
.drillcard summary{ position:relative; padding-right:36px; }
.drillcard summary::after{ right:14px; top:10px; }
.drillname{ font-weight:600; font-size:0.96rem; color:var(--text); }
.drillwhere{ font-size:0.74rem; color:var(--swim); }
.drillbody{ padding:0 14px 12px; font-size:0.87rem; line-height:1.55; color:var(--text-dim); border-top:1px solid var(--border); }
.drillbody p{ margin:8px 0; }
.drillbody ol{ margin:4px 0 8px; padding-left:20px; }
.drillbody li{ margin-bottom:3px; }
.drillh{ font-family:'Oswald'; font-weight:600; font-size:0.74rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--amber); margin-top:10px; }
.mynote{ font-size:0.8rem; color:var(--amber); background:#2a2114; border-radius:6px; padding:6px 9px; margin-bottom:8px; line-height:1.45; }
/* ---------- Swim ---------- */
:root{ --swim:#3a8fd6; --swim-soft:#16283a; }
.section-toggle button.active[data-section="swim"]{ background:var(--swim); border-color:var(--swim); color:#fff; }
.pill.active.swim{ background:var(--swim); border-color:var(--swim); color:#fff; }
.pilldate{ font-family:'Inter'; font-weight:400; font-size:0.7rem; opacity:0.75; margin-left:3px; }
.weekhead{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-top:6px; }
.weekfocus{ margin-top:8px; font-size:0.86rem; color:var(--text); }
.bbline{ margin-top:8px; font-size:0.8rem; color:var(--text-dim); background:var(--booty-soft); border-radius:6px; padding:6px 8px; line-height:1.4; }
.tpline{ margin-top:8px; font-size:0.84rem; color:var(--text-dim); }
.tpline b{ color:var(--swim); }
.swimcard{ margin-top:10px; }
.eventcard{ border-color:var(--amber); }
.sec-swim{ border-left-color:var(--swim); }
.swimsetlabel{ font-weight:600; font-size:0.92rem; }
.thenTxt{ font-weight:400; color:var(--text-dim); }
.swimdetail{ font-size:0.82rem; color:var(--text-dim); margin-top:4px; line-height:1.45; }
.swimtable td:first-child{ width:42%; }
.target{ font-size:0.7rem; color:var(--swim); margin-top:1px; }
.opt{ font-size:0.62rem; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:0 3px; }
.tInput:focus{ outline:2px solid var(--swim); border-color:var(--swim); }
.thisavg{ color:var(--swim); }
.lasthint.tiny{ font-size:0.66rem; opacity:0.7; }
.fieldrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.fieldbox{ display:flex; flex-direction:column; gap:4px; font-size:0.72rem; color:var(--text-faint); flex:1; min-width:110px; }
.fieldbox.wide{ flex-basis:100%; }
.fieldbox .wInput{ width:100%; }
.swimNote{ width:100%; margin-top:8px; min-height:42px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 8px; font-family:'Inter'; font-size:0.84rem; resize:vertical; }
.bigtp{ font-family:'Oswald'; font-size:2.4rem; font-weight:700; color:var(--swim); margin-top:6px; }
.bigtp span{ font-size:1rem; color:var(--text-dim); margin-left:4px; }
.eventrow{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
.evright{ font-family:'Oswald'; color:var(--swim); }
.drilllist dt{ font-weight:600; font-size:0.92rem; margin-top:10px; color:var(--swim); }
.drilllist dd{ margin:3px 0 0; font-size:0.85rem; color:var(--text-dim); line-height:1.5; }
.daycard + .daycard{ margin-top:10px; }

@media (max-width:400px){
  .exname{ min-width:100%; }
}
</style>
</head>

// ---- set builders ----
// tp(n, d, off, then, nMax): n reps of d metres at Test Pace + off sec/100m
function tp(n, d, off, then, nMax){
  const offTxt = off===0 ? "@ Test Pace" : (off>0 ? `@ ${off}s slower than TP` : `@ ${-off}s faster than TP`);
  const countTxt = nMax ? `${n}–${nMax}` : `${n}`;
  return { label: `${countTxt} × ${d}m ${offTxt}`, then, log:{type:"reps", n:(nMax||n), nMin:(nMax?n:null), d, off}, setKey:`tp${d}@${off}` };
}
function txt(label, detail){ return { label, detail }; }
function reps(label, n, d, setKey, detail, nMin){ return { label, detail, log:{type:"reps", n, d, nMin:nMin||null}, setKey }; }
function owLog(label, detail, setKey){ return { label, detail, log:{type:"fields", fields:[{k:"time",label:"Time",kind:"time"},{k:"dist",label:"Distance (m)",kind:"num"}]}, setKey }; }

// ---------- time helpers ----------
function parseTime(str){
  if(str===null || str===undefined) return null;
  str = String(str).trim();
  if(!str) return null;
  if(str.includes(":") || str.includes(".")){
    const parts = str.split(/[:.]/).map(p=>parseInt(p,10));
    if(parts.some(isNaN)) return null;
    return parts.reduce((acc,p)=> acc*60 + p, 0);
  }
  if(!/^\d+$/.test(str)) return null;
  if(str.length<=2) return parseInt(str,10);
  const ss = parseInt(str.slice(-2),10), rest = str.slice(0,-2);
  if(rest.length<=2) return parseInt(rest,10)*60 + ss;
  return parseInt(rest.slice(0,-2),10)*3600 + parseInt(rest.slice(-2),10)*60 + ss;
}
function fmtTime(sec){
  if(sec===null || sec===undefined || isNaN(sec)) return "";
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}

// ---------- storage (reuses booty_picks as a key/value store) ----------
function swimKey(weekId, slot, idx, setKey){ return ["swim", weekId, slot, idx, setKey].join("|"); }
function swimGet(weekId, slot, idx, setKey){ return cache.picks[swimKey(weekId, slot, idx, setKey)] || ""; }
function swimSet(weekId, slot, idx, setKey, val){
  const k = swimKey(weekId, slot, idx, setKey);
  cache.picks[k] = val;
  debouncedWrite("s_"+k, ()=>{
    sbUpsert("booty_picks", {pick_key:k, value:val});
    localStorage.setItem("supabase_cache_backup", JSON.stringify(cache));
  }, 500);
}
function swimSettingGet(name){ return cache.picks["swim|settings|"+name] || ""; }
function swimSettingSet(name, val){
  cache.picks["swim|settings|"+name] = val;
  debouncedWrite("ss_"+name, ()=> sbUpsert("booty_picks", {pick_key:"swim|settings|"+name, value:val}), 500);
}

// all logged entries for a setKey, grouped by week+slot, sorted oldest → newest
function swimEntries(setKey){
  const groups = {};
  Object.keys(cache.picks).forEach(k=>{
    if(!k.startsWith("swim|")) return;
    const p = k.split("|");
    if(p.length!==5 || p[4]!==setKey) return;
    const v = cache.picks[k];
    if(!v) return;
    const w = SWIM_WEEKS.find(x=>x.id===p[1]);
    if(!w) return;
    const g = groups[p[1]+"|"+p[2]] = groups[p[1]+"|"+p[2]] || {week:w, slot:p[2], vals:[]};
    g.vals[parseInt(p[3],10)] = v;
  });
  return Object.values(groups).sort((a,b)=> a.week.order-b.week.order || (a.slot<b.slot?-1:1));
}
function swimLastBefore(setKey, week, slot){
  const e = swimEntries(setKey).filter(g=> g.week.order < week.order || (g.week.order===week.order && g.slot < slot));
  return e.length ? e[e.length-1] : null;
}

// Test Pace (sec per 100m) in force for a given week
function testResults(){
  return SWIM_WEEKS.filter(w=>w.block==="tri" && [1,4,8].includes(w.n)).map(w=>{
    const vals = [0,1,2,3,4].map(i=> parseTime(swimGet(w.id, "A#0", i, "test5x200"))).filter(v=>v);
    return {week:w, vals, avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null};
  });
}
function tpForWeek(week){
  const tests = testResults().filter(t=> t.avg && t.vals.length>=3 && t.week.order<=week.order);
  if(tests.length) return {tp: tests[tests.length-1].avg/2, src:"Test "+swimPillLabel(tests[tests.length-1].week)};
  const manual = parseTime(swimSettingGet("tp_manual"));
  if(manual) return {tp: manual, src:"manual"};
  return null;
}
function currentSwimWeek(){
  const today = new Date(); today.setHours(0,0,0,0);
  let found = SWIM_WEEKS[0];
  SWIM_WEEKS.forEach(w=>{ if(new Date(w.start+"T00:00:00") <= today) found = w; });
  return found;
}

// ---------- render ----------
function renderSwim(){

  if(state.swimTab==="pace") return html + renderSwimPace();
  return html + renderSwimPlan();

  html += `<div class="pillrow daypills" id="swimWeekPills">`;

  </div>`;

function renderSwimSession(w, s, tpInfo){
  const date = addDays(w.start, s.day);
  const done = swimGet(w.id, s.id, 0, "done") === "1";
  let html = `<div class="daycard swimcard ${s.event?'eventcard':''}">
    <div class="dayhead">
      <div>
        <div class="daytitle">${s.title}</div>
        <div class="daysubtitle">${fmtDate(date)}${s.sub?` · ${s.sub}`:""}</div>
      </div>
      <label class="donetoggle"><input type="checkbox" class="swimDone" data-week="${w.id}" data-sess="${s.id}" ${done?"checked":""}/><span>Done</span></label>
    </div>`;
  s.sets.forEach((set, i)=>{
    const slot = s.id+"#"+i;
    html += `<div class="seccard ${set.log?'sec-swim':'sec-ref'}">`;
    html += `<div class="swimsetlabel">${set.label}${set.then?` <span class="thenTxt">· ${set.then}</span>`:""}</div>`;
    if(set.detail) html += `<div class="swimdetail">${set.detail}</div>`;
    if(set.log) html += renderSwimLog(w, slot, set, tpInfo);
    html += `</div>`;
  });
  if(s.note) html += `<div class="secnote">${s.note}</div>`;
  const note = swimGet(w.id, s.id, 0, "note");
  html += `<textarea class="swimNote" data-week="${w.id}" data-sess="${s.id}" placeholder="Notes — how it felt, conditions…">${escapeHtml(note)}</textarea>`;
  html += `</div>`;
  return html;
}
function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function renderSwimLog(w, slot, set, tpInfo){
  const L = set.log;
  const last = swimLastBefore(set.setKey, w, slot);
  let html = "";
  if(L.type==="reps"){
    const target = (L.off!==undefined && tpInfo) ? (tpInfo.tp + L.off) * L.d/100 : null;
    html += `<table class="setstable swimtable"><tbody>`;
    const cur = [];
    for(let i=0;i<L.n;i++){
      const v = swimGet(w.id, slot, i, set.setKey);
      if(parseTime(v)) cur.push(parseTime(v));
      const lastV = last && last.vals[i] ? last.vals[i] : "";
      const optional = L.nMin && i>=L.nMin;
      html += `<tr>
        <td class="setlabel">${L.d>=1000?'Swim':'Rep '+(i+1)}${optional?' <span class="opt">opt</span>':''}${target?`<div class="target">🎯 ${fmtTime(target)}</div>`:''}</td>
        <td><input type="text" inputmode="numeric" class="wInput tInput swimIn" data-week="${w.id}" data-slot="${slot}" data-idx="${i}" data-setkey="${set.setKey}" value="${escapeHtml(v)}" placeholder="${lastV?lastV:'m:ss'}"/></td>
      </tr>`;
    }
    html += `</tbody></table>`;
    if(cur.length){
      const avg = cur.reduce((a,b)=>a+b,0)/cur.length;
      html += `<div class="lasthint thisavg">This session: avg ${fmtTime(avg)} (${fmtTime(avg/L.d*100)}/100m)${L.test?` → Test Pace ${fmtTime(avg/2)}/100m`:''}</div>`;
    }
    if(last){
      const lv = last.vals.map(v=>parseTime(v)).filter(v=>v);
      const lavg = lv.length ? lv.reduce((a,b)=>a+b,0)/lv.length : null;
      html += `<div class="lasthint">Last time (${swimPillLabel(last.week)}): ${last.vals.map(v=>v||'–').join(' / ')}${lavg?` · avg ${fmtTime(lavg)}`:''}</div>`;
    } else {
      html += `<div class="lasthint">First time swimming this set</div>`;
    }
    html += `<div class="lasthint tiny">Type 345 for 3:45 — it formats itself.</div>`;
  } else {
    html += `<div class="fieldrow">`;
    L.fields.forEach((f, i)=>{
      const v = swimGet(w.id, slot, i, set.setKey);
      const lastV = last && last.vals[i] ? last.vals[i] : "";
      const im = f.kind==="text" ? 'type="text"' : (f.kind==="time" ? 'type="text" inputmode="numeric"' : 'type="number" inputmode="decimal" step="any"');
      html += `<label class="fieldbox ${f.kind==='text'?'wide':''}"><span>${f.label}</span>
        <input ${im} class="wInput swimIn ${f.kind==='time'?'tInput':''}" data-week="${w.id}" data-slot="${slot}" data-idx="${i}" data-setkey="${set.setKey}" value="${escapeHtml(v)}" placeholder="${lastV?escapeHtml(lastV):(f.kind==='time'?'m:ss':'')}"/></label>`;
    });
    html += `</div>`;
    if(last){
      html += `<div class="lasthint">Last time (${swimPillLabel(last.week)}): ${L.fields.map((f,i)=> last.vals[i]?`${f.label} ${last.vals[i]}`:null).filter(Boolean).join(' · ')}</div>`;
    }
  }
  return html;
}

function renderSwimPace(){
  const cw = currentSwimWeek();
  const tpInfo = tpForWeek(cw);
  let html = `<div class="daycard"><div class="daytitle">Your Test Pace</div>`;
  html += tpInfo ? `<div class="bigtp">${fmtTime(tpInfo.tp)}<span>/100m</span></div><div class="secnote">From ${tpInfo.src==="manual"?"your manual entry":tpInfo.src}</div>`
                 : `<div class="secnote">No test logged yet. Do your first test (5 × 200m) on Tue 13 Oct.</div>`;
  html += `<table class="histtable" style="margin-top:10px"><tr><th>Test</th><th>200m times</th><th>Avg 200</th><th>TP</th></tr>`;
  testResults().forEach(t=>{
    html += `<tr><td>${swimPillLabel(t.week)} · ${fmtShort(addDays(t.week.start,1))}</td><td>${t.vals.length?t.vals.map(fmtTime).join(', '):'–'}</td><td>${t.avg?fmtTime(t.avg):'–'}</td><td>${t.avg?fmtTime(t.avg/2):'–'}</td></tr>`;
  });
  html += `</table>

    <input type="text" inputmode="numeric" class="wInput tInput" id="tpManual" value="${escapeHtml(swimSettingGet('tp_manual'))}" placeholder="e.g. 1:50"/></label></div>
  </div>`;

  if(tpInfo){
    const offs = [[-5,"5s faster"],[-3,"3s faster"],[0,"Test Pace"],[5,"5s slower"],[10,"10s slower"]];
    html += `<div class="daycard"><div class="daytitle">Target times</div><div class="secnote">What each pace means for each rep distance.</div>
      <table class="histtable" style="margin-top:8px"><tr><th></th><th>50m</th><th>100m</th><th>150m</th><th>200m</th><th>300m</th><th>400m</th></tr>`;
    offs.forEach(([o,l])=>{
      html += `<tr><td>${l}</td>${[50,100,150,200,300,400].map(d=>`<td>${fmtTime((tpInfo.tp+o)*d/100)}</td>`).join("")}</tr>`;
    });
    html += `</table></div>`;
  }

  html += `<div class="daycard"><div class="daytitle">Events</div>`;
  const today = new Date(); today.setHours(0,0,0,0);
  SWIM_EVENTS.forEach(ev=>{
    const d = new Date(ev.date+"T00:00:00");
    const days = Math.round((d-today)/86400000);
    const res = swimEntries(ev.key);
    const r = res.length ? res[res.length-1].vals : [];
    html += `<div class="eventrow"><div><b>${ev.name} — ${ev.dist}</b><div class="secnote">${fmtDate(d)}</div></div>
      <div class="evright">${r[0] ? `<b>${r[0]}</b>` : (days>=0 ? `${days} days` : "–")}</div></div>`;
  });
  html += `</div>`;
  return html;
}

// re-render (to refresh averages / targets) only once the user has left the inputs, keeping scroll position

    render(true);
  }, 0);
}

// ---------- Supabase REST helpers ----------
async function sbFetchAll(table){
  // page through in chunks of 1000 so large tables (e.g. swim logs) load completely
  let all = [], from = 0;
  while(true){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, { headers: { ...SB_HEADERS, Range: `${from}-${from+999}` } });
    if(!res.ok) throw new Error("fetch failed: "+table);
    const rows = await res.json();
    all = all.concat(rows);
    if(rows.length < 1000) break;
    from += 1000;
  }
  return all;
}
async function sbUpsert(table, row){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: "POST",
      headers: { ...SB_HEADERS, Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([row])
    });
  }catch(e){ console.error("sbUpsert failed", table, row, e); }
}

// debounce writes per unique field so fast typing doesn't spam requests
const debounceTimers = {};
function debouncedWrite(id, fn, delay){
  clearTimeout(debounceTimers[id]);
  debounceTimers[id] = setTimeout(fn, delay || 400);
}

function numOrNull(v){
  if(v === "" || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

// ---------- load all data from Supabase into the local cache ----------
async function loadAllData(){
  try{
    const [weights, picks, dayDone, coreGrid, blockOv] = await Promise.all([
      sbFetchAll("booty_weights"), sbFetchAll("booty_picks"), sbFetchAll("booty_day_done"),
      sbFetchAll("core_grid"), sbFetchAll("core_block_override")
    ]);
    const c = { weights:{}, picks:{}, dayDone:{}, coreGrid:{}, blockOv:{} };
    weights.forEach(r=>{
      c.weights[r.exercise_key] = c.weights[r.exercise_key] || {};
      const wk = c.weights[r.exercise_key][r.week] = c.weights[r.exercise_key][r.week] || {C:[], M:[]};
      wk.C[r.set_idx] = r.c_weight != null ? String(r.c_weight) : "";
      wk.M[r.set_idx] = r.m_weight != null ? String(r.m_weight) : "";
    });
    picks.forEach(r=> c.picks[r.pick_key] = r.value);
    dayDone.forEach(r=> c.dayDone[r.week+"_"+r.day] = r.done);
    coreGrid.forEach(r=>{
      c.coreGrid[r.phase_key] = c.coreGrid[r.phase_key] || {};
      c.coreGrid[r.phase_key][r.week+"_"+r.day] = {C:r.c_done, M:r.m_done};
    });
    blockOv.forEach(r=> c.blockOv[r.phase_key+"_"+r.week+"_"+r.day] = r.block_key);
    cache = c;
    syncFailed = false;

    // one-off migration: push any pre-existing localStorage data up, only if
    // the database looks empty and this device has old local entries
    const isEmpty = weights.length===0 && picks.length===0 && dayDone.length===0 && coreGrid.length===0 && blockOv.length===0;
    if(isEmpty && !localStorage.getItem("migrated_to_supabase")){
      await migrateLegacyLocalStorage();
    }
    localStorage.setItem("supabase_cache_backup", JSON.stringify(cache));
  }catch(e){
    console.error("loadAllData failed, falling back to last known cache", e);
    syncFailed = true;
    const backup = lsGet("supabase_cache_backup");
    if(backup) cache = backup;
  }
  dataReady = true;
}

async function migrateLegacyLocalStorage(){
  const jobs = [];
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith("w_")){
      const key = k.slice(2);
      const hist = lsGet(k) || {};
      Object.keys(hist).forEach(week=>{
        const rec = hist[week];
        const nSets = Math.max((rec.C||[]).length, (rec.M||[]).length);
        for(let i=0;i<nSets;i++){
          const cw = numOrNull((rec.C||[])[i]);
          const mw = numOrNull((rec.M||[])[i]);
          if(cw!==null || mw!==null){
            jobs.push(sbUpsert("booty_weights", {exercise_key:key, week:parseInt(week,10), set_idx:i, c_weight:cw, m_weight:mw}));
            cache.weights[key] = cache.weights[key] || {};
            cache.weights[key][week] = cache.weights[key][week] || {C:[],M:[]};
            cache.weights[key][week].C[i] = (rec.C||[])[i] || "";
            cache.weights[key][week].M[i] = (rec.M||[])[i] || "";
          }
        }
      });
    } else if(k.startsWith("p_")){
      const pickKey = k.slice(2);
      const val = localStorage.getItem(k);
      if(val){ jobs.push(sbUpsert("booty_picks", {pick_key:pickKey, value:val})); cache.picks[pickKey] = val; }
    } else if(k.startsWith("d_")){
      const parts = k.slice(2).split("_");
      const week = parseInt(parts[0],10), day = parts.slice(1).join("_");
      const done = localStorage.getItem(k) === "1";
      jobs.push(sbUpsert("booty_day_done", {week, day, done}));
      cache.dayDone[week+"_"+day] = done;
    } else if(k.startsWith("core_grid_")){
      const phaseKey = k.slice("core_grid_".length);
      const grid = lsGet(k) || {};
      Object.keys(grid).forEach(wd=>{
        const week = wd.split("_")[0], day = wd.split("_").slice(1).join("_");
        const cell = grid[wd] || {};
        jobs.push(sbUpsert("core_grid", {phase_key:phaseKey, week:parseInt(week,10), day, c_done:!!cell.C, m_done:!!cell.M}));
        cache.coreGrid[phaseKey] = cache.coreGrid[phaseKey] || {};
        cache.coreGrid[phaseKey][wd] = {C:!!cell.C, M:!!cell.M};
      });
    } else if(k.startsWith("core_block_")){
      const rest = k.slice("core_block_".length);
      const parts = rest.split("_");
      const phaseKey = parts[0], week = parseInt(parts[1],10), day = parts.slice(2).join("_");
      const blockKey = localStorage.getItem(k);
      if(blockKey){ jobs.push(sbUpsert("core_block_override", {phase_key:phaseKey, week, day, block_key:blockKey})); cache.blockOv[phaseKey+"_"+week+"_"+day] = blockKey; }
    }
  });
  await Promise.all(jobs);
  localStorage.setItem("migrated_to_supabase", "1");
}

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

// ---------- accessors used by render functions (all synchronous, read from cache) ----------
function getExHistory(key){ return cache.weights[key] || {}; }
function setExValue(key, week, field, setIdx, val){
  cache.weights[key] = cache.weights[key] || {};
  cache.weights[key][week] = cache.weights[key][week] || {C:[], M:[]};
  cache.weights[key][week][field][setIdx] = val;
  const rec = cache.weights[key][week];
  debouncedWrite("w_"+key+"_"+week+"_"+setIdx, ()=>{
    sbUpsert("booty_weights", {
      exercise_key:key, week:parseInt(week,10), set_idx:setIdx,
      c_weight:numOrNull(rec.C[setIdx]), m_weight:numOrNull(rec.M[setIdx])
    });
    localStorage.setItem("supabase_cache_backup", JSON.stringify(cache));
  });
}
function getLastBefore(key, week){
  const h = getExHistory(key);
  let bestWeek = -1, best = null;
  Object.keys(h).forEach(w=>{
    const wn = parseInt(w,10);
    const rec = h[w];
    const hasAny = (rec.C||[]).some(v=>v) || (rec.M||[]).some(v=>v);
    if(wn < week && wn > bestWeek && hasAny){ bestWeek = wn; best = rec; }
  });
  return bestWeek > -1 ? {week:bestWeek, ...best} : null;
}

function getPick(key){ return cache.picks[key] || ""; }
function setPick(key, val){
  cache.picks[key] = val;
  debouncedWrite("p_"+key, ()=> sbUpsert("booty_picks", {pick_key:key, value:val}), 50);
}

function getDayDone(week, day){ return !!cache.dayDone[week+"_"+day]; }
function setDayDone(week, day, val){
  cache.dayDone[week+"_"+day] = val;
  sbUpsert("booty_day_done", {week:parseInt(week,10), day, done:val});
}

function getCoreGrid(phaseKey){ return cache.coreGrid[phaseKey] || {}; }
function setCoreGridCell(phaseKey, week, day, field, val){
  cache.coreGrid[phaseKey] = cache.coreGrid[phaseKey] || {};
  const cell = cache.coreGrid[phaseKey][week+"_"+day] = cache.coreGrid[phaseKey][week+"_"+day] || {C:false, M:false};
  cell[field] = val;
  sbUpsert("core_grid", {phase_key:phaseKey, week:parseInt(week,10), day, c_done:cell.C, m_done:cell.M});
}
function getCoreBlockOverride(phaseKey, week, day){ return cache.blockOv[phaseKey+"_"+week+"_"+day] || ""; }
function setCoreBlockOverride(phaseKey, week, day, val){
  cache.blockOv[phaseKey+"_"+week+"_"+day] = val;
  sbUpsert("core_block_override", {phase_key:phaseKey, week:parseInt(week,10), day, block_key:val});
}

function render(keepScroll){
  document.querySelectorAll(".section-toggle button").forEach(b=>{
    b.classList.toggle("active", b.dataset.section === state.section);

// ---------- program calendar: Booty Builder weeks across repeats, lined up with the swim plan ----------
// abs = absolute program week (round 1 = 1–8, round 2 = 9–16, round 3 = 17–24) — used as the "week" for weights so repeats don't overwrite
const BB_CAL = (()=>{
  const starts = ["2026-09-21","2026-09-28","2026-10-05","2026-10-12","2026-10-19","2026-10-26","2026-11-02","2026-11-09",
                  "2026-11-16","2026-11-23","2026-11-30","2026-12-07","2026-12-14","2026-12-21", "BREAK:2026-12-28",
                  "2027-01-04","2027-01-11","2027-01-18","2027-01-25","2027-02-01","2027-02-08","2027-02-15","2027-02-22","2027-03-01","2027-03-08"];
  let abs = 0;
  return starts.map(s=>{
    if(s.startsWith("BREAK:")) return {abs:null, start:s.slice(6), isBreak:true};
    abs++;
    return {abs, start:s, round:Math.ceil(abs/8), pw:((abs-1)%8)+1};
  });
})();
const SWIM_LAYOUT_FROM = 4; // swim schedule applies from week 4 of round 1 (12 Oct)
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function calIdx(){ return BB_CAL.findIndex(c=> c.start===state.bootyCal); }
function calLabel(c){ if(c.isBreak) return "Break"; return (c.round>1?`R${c.round}·`:"")+"W"+c.pw; }
function currentCal(){
  const today = new Date(); today.setHours(0,0,0,0);
  let found = BB_CAL[0];
  BB_CAL.forEach(c=>{ if(new Date(c.start+"T00:00:00") <= today) found = c; });
  return found;
}
function swimWeekFor(c){ return SWIM_WEEKS.find(w=> w.start===c.start) || null; }
const PULL_RE = /Row|Pulldown|Pull-Up|Face Pull/;

// One view: the original Booty Builder days (same as your training buddy) with your swims slotted under each day
function weekDays(c){
  const sw = swimWeekFor(c);
  const sess = sw ? swimSessions(sw) : [];
  const swimsOn = off => sess.filter(s=> s.day===off);
  const days = DAY_NAMES.map((n,i)=>({day:n, gym:null, extra:null, swims:swimsOn(i), notes:[]}));
  if(c.isBreak) return {days, sw};
  const bw = BOOTY.weeks.find(w=> w.num===c.pw);
  bw.days.forEach(g=>{ days[DAY_NAMES.indexOf(g.day)].gym = g; });
  // swap the upper days: Upper 2 (pull) on Tuesday, Upper 1 (push) on Friday
  const tue = days[1], fri = days[4];
  if(tue.gym && fri.gym && tue.gym.title==="Upper Body Strength 1" && fri.gym.title==="Upper Body Strength 2"){
    const t = tue.gym; tue.gym = fri.gym; fri.gym = t;
  }
  if(!sw) return {days, sw};

  const raceWeek = sw.id==="B8";
  days.forEach(d=>{
    if(!d.gym) return;
    const t = d.gym.title;
    if(raceWeek && /Optional/.test(t)) {}
    else if(/Optional/.test(t) && d.swims.length) d.notes.push("Skip this — your swim below replaces it.");
    else if(/Optional/.test(t)) d.notes.push("Optional — skip it, you're getting your cardio from swimming.");
    if(t==="Upper Body Strength 1" && !raceWeek) d.notes.push("Optional — Friday is your only rest day, so do it when you feel fresh. Skipping it? Do the push finisher on Wednesday.");
    if(raceWeek && /Upper|Lower Body Strength 3|Optional/.test(t)) d.notes.push("Busso race week — skip this one.");
    if(raceWeek && /Lower Body Strength [12]/.test(t)) d.notes.push("Busso race week — go light.");
  });
  if(sw.id==="T6") days[5].notes.push("Ocean swim today — do Lower 3 on Sunday instead.");
  // optional pull finisher on Wednesday (for weeks you skip Friday)
  const U1 = bw.days.find(g=> g.title==="Upper Body Strength 1");
  const wed = days.find(x=> x.gym && x.gym.title==="Lower Body Strength 2");
  if(U1 && !raceWeek && wed){
    const items = [];
    U1.sections.forEach(sec=> (sec.items||[]).forEach(it=>{ if(it.log && items.length<2) items.push(it); }));
    if(items.length) wed.extra = {type:"main", label:"Optional push finisher (from Upper 1)", note:"Only on weeks you'll skip Upper 1 on Friday. 10 mins after your lower session, 2–3 sets each.", items};
  }
  return {days, sw};
}

function renderBooty(){
  if(!state.bootyCal){ state.bootyCal = currentCal().start; state.bootyDay = DAY_NAMES[(new Date().getDay()+6)%7]; }
  const c = BB_CAL[calIdx()] || BB_CAL[0];

  let html = `<div class="pillrow" id="weekPills">`;
  BB_CAL.forEach(w=>{
    html += `<button class="pill ${w.start===c.start?'active booty':''}" data-cal="${w.start}">${calLabel(w)} <span class="pilldate">${fmtShort(addDays(w.start,0))}</span></button>`;
  });
  html += `</div>`;

  const {days, sw} = weekDays(c);
  const shown = days.filter(d=> d.gym || d.swims.length || d.day==="Friday");
  if(!shown.find(d=> d.day===state.bootyDay)) state.bootyDay = shown[0].day;
  html += `<div class="pillrow daypills" id="dayPills">`;
  shown.forEach(d=>{
    const has = d.gym || d.swims.length;
    html += `<button class="pill daypill ${d.day===state.bootyDay?'active booty':''} ${has?'':'restpill'}" data-day="${d.day}">${d.day.slice(0,3)}${d.swims.length?' 🏊':''}</button>`;
  });
  html += `</div>`;

  if(sw){
    const tpInfo = tpForWeek(sw);
    html += `<div class="weekhead"><div class="daysubtitle">${swimWeekLabel(sw)} · ${fmtShort(addDays(c.start,0))} – ${fmtShort(addDays(c.start,6))}</div>
      ${sw.focus?`<div class="weekfocus">${sw.focus}</div>`:""}
      ${sw.block==="tri" ? `<div class="tpline">${tpInfo ? `Test Pace: <b>${fmtTime(tpInfo.tp)}/100m</b>` : `Test Pace not set yet — log your test and targets appear.`}</div>` : ""}
    </div>`;
  }

  const d = days.find(x=> x.day===state.bootyDay);
  const dateStr = fmtDate(addDays(c.start, DAY_NAMES.indexOf(d.day)));
  if(d.gym) html += renderGymCard(c, d.gym.day, d.gym, d.extra, dateStr, d.notes);
  else if(d.notes.length) html += `<div class="daycard"><div class="daytitle">${dateStr}</div>${d.notes.map(n=>`<div class="mynote">${n}</div>`).join("")}</div>`;
  if(d.swims.length){
    const tpInfo = sw ? tpForWeek(sw) : null;
    d.swims.forEach(s=> html += renderSwimSession(sw, s, tpInfo));
  }
  if(!d.gym && !d.swims.length && !d.notes.length){
    html += `<div class="daycard"><div class="daytitle">${dateStr}</div><div class="daysubtitle">${c.isBreak ? "Break — nothing planned." : "Rest day."}</div></div>`;
  }
  return html;
}

function renderGymCard(c, dayKey, day, extra, heading, notes){
  const done = getDayDone(c.abs, dayKey);
  let html = `<div class="daycard">
    <div class="dayhead">
      <div>
        <div class="daytitle">${day.title}</div>
        <div class="daysubtitle">${heading} · Booty Builder ${calLabel(c)}</div>
      </div>
      <label class="donetoggle">
        <input type="checkbox" id="dayDoneBox" data-week="${c.abs}" data-day="${dayKey}" ${done?"checked":""}/>
        <span>Session done</span>
      </label>
    </div>`;
  (notes||[]).forEach(n=> html += `<div class="mynote">${n}</div>`);
  day.sections.forEach((sec, si)=>{ html += renderSection(sec, si, c.abs, dayKey); });
  if(extra) html += renderSection(extra, 99, c.abs, dayKey).replace('class="seccard sec-main"','class="seccard sec-main sec-optional"');
  html += `</div>`;
  return html;
}

function renderSection(sec, si, week, day){
  let cls = "seccard sec-" + sec.type;
  let html = `<div class="${cls}">`;
  if(sec.label) html += `<div class="seclabel">${sec.label}</div>`;

  if(sec.type === "ref"){
    html += `<ul class="reflist">`;
    sec.lines.forEach(l=> html += `<li>${l}</li>`);
    html += `</ul>`;
    if(sec.note) html += `<div class="secnote">${sec.note}</div>`;
  }

  if(sec.type === "main"){
    html += `<div class="exlist">`;
    sec.items.forEach(it=>{
      html += renderExerciseRow(it, week);
    });
    html += `</div>`;
    if(sec.note) html += `<div class="secnote">${sec.note}</div>`;
  }

  if(sec.type === "pickone"){
    const pickKey = sec.key + "_w" + week + "_" + day;
    const current = getPick(pickKey);
    html += `<div class="pickrow" data-pickkey="${pickKey}">`;
    sec.options.forEach(opt=>{
      html += `<button class="pickbtn ${current===opt?'chosen':''}" data-opt="${opt}">${opt}</button>`;
    });
    html += `</div>`;
    if(sec.extraLines) html += `<div class="secnote">${sec.extraLines.join(" · ")}</div>`;
    if(sec.note) html += `<div class="secnote">${sec.note}</div>`;
  }

  html += `</div>`;
  return html;
}

function absLabel(n){ const r = Math.ceil(n/8), p = ((n-1)%8)+1; return (r>1?`R${r}·`:"")+"W"+p; }
function renderExerciseRow(it, week){
  if(!it.log){
    return `<div class="exrow exrow-noLog">
      <div class="exname">${it.name}</div>
      <div class="exreps">${it.reps}</div>
    </div>`;
  }
  const nSets = it.sets || 1;
  const hist = getExHistory(it.key);
  const cur = hist[week] || {C:[], M:[]};
  const last = getLastBefore(it.key, week);

  const histWeeks = Object.keys(hist).map(w=>parseInt(w,10))
    .filter(w=> (hist[w].C||[]).some(v=>v) || (hist[w].M||[]).some(v=>v))
    .sort((a,b)=>a-b);
  let historyTable = "";
  if(histWeeks.length){
    historyTable = `<table class="histtable"><tr><th>Wk</th><th>C</th><th>M</th></tr>` +
      histWeeks.map(w=>{
        const c = (hist[w].C||[]).map(v=>v||'–').join(', ');
        const m = (hist[w].M||[]).map(v=>v||'–').join(', ');
        return `<tr><td>${absLabel(w)}</td><td>${c}</td><td>${m}</td></tr>`;
      }).join("") +
      `</table>`;
  }

  let setsRows = "";
  for(let i=0; i<nSets; i++){
    const lastC = last && last.C && last.C[i] ? last.C[i] : "";
    const lastM = last && last.M && last.M[i] ? last.M[i] : "";
    const curC = (cur.C||[])[i] || "";
    const curM = (cur.M||[])[i] || "";
    setsRows += `<tr>
      <td class="setlabel">Set ${i+1}</td>
      <td><input type="number" step="0.5" inputmode="decimal" class="wInput" data-field="C" data-setidx="${i}" value="${curC}" placeholder="${lastC?lastC+'kg':'kg'}"/></td>
      <td><input type="number" step="0.5" inputmode="decimal" class="wInput" data-field="M" data-setidx="${i}" value="${curM}" placeholder="${lastM?lastM+'kg':'kg'}"/></td>
    </tr>`;
  }

  const lastStr = last ? `Last time (${absLabel(last.week)}): C ${(last.C||[]).map(v=>v||'–').join('/')}kg · M ${(last.M||[]).map(v=>v||'–').join('/')}kg` : `First time logging this`;

  return `<div class="exrow" data-key="${it.key}" data-week="${week}">
    <div class="exrow-top">
      <div class="exname">${it.name}</div>
      <div class="exreps">${it.reps}</div>
      <button class="histbtn" title="View history">History</button>
    </div>
    <table class="setstable">
      <thead><tr><th></th><th>C</th><th>M</th></tr></thead>
      <tbody>${setsRows}</tbody>
    </table>
    <div class="lasthint">${lastStr}</div>
    <div class="histpanel" style="display:none;">${historyTable || '<div class="secnote">No history yet</div>'}</div>
  </div>`;
}

function renderCore(){

  let html = `<div class="pillrow" id="phasePills">`;
  DEEPCORE.phases.forEach(p=>{
    html += `<button class="pill ${p.key===state.corePhase?'active core':''}" data-phase="${p.key}">${p.name.split('—')[0].trim()}</button>`;
  });
  html += `</div>`;
  html += `<div class="phasefullname">${phase.name} <span class="secnote">· 4 weeks</span></div>`;

  if(phase.mode === "fixed"){
    html += `<div class="daycard">`;

      html += `<div class="seccard sec-ref">

function renderByTypeNav(phase){
  let html = `<div class="pillrow" id="coreWeekPills">`;

  }
  html += `</div>`;

  html += `<div class="pillrow daypills" id="coreDayPills">`;

    html += `<button class="pill daypill ${d===state.coreDay?'active core':''}" data-coreday="${d}">${d}</button>`;
  });
  html += `</div>`;

  const defaultBlock = DEEPCORE.weekdayDefault[state.coreDay] || "lower";
  const override = getCoreBlockOverride(phase.key, state.coreWeek, state.coreDay);
  const activeBlockKey = override || defaultBlock;

  const isRestDay = state.coreDay === "Sun";
  const cell = getCoreGrid(phase.key)[state.coreWeek+"_"+state.coreDay] || {};

  html += `<div class="daycard">

      <div>

        <div class="daysubtitle">${block.label}</div>
      </div>
      <div class="donepair">
        <label class="donetoggle"><input type="checkbox" id="coreDoneC" ${cell.C?"checked":""}/><span>C</span></label>
        <label class="donetoggle"><input type="checkbox" id="coreDoneM" ${cell.M?"checked":""}/><span>M</span></label>
      </div>
    </div>
    <div class="blockswitch">
      <label>Block:</label>
      <select id="blockOverride">
        ${Object.keys(phase.blocks).map(k=>`<option value="${k}" ${k===activeBlockKey?"selected":""}>${phase.blocks[k].label}</option>`).join("")}
      </select>
    </div>
    <div class="seccard sec-ref">
      <ul class="reflist">${block.items.map(i=>`<li>${i}</li>`).join("")}</ul>
      ${block.note?`<div class="secnote">${block.note}</div>`:""}
    </div>
  </div>`;

  return html;
}

function attachHandlers(){
  document.querySelectorAll("#weekPills .pill").forEach(b=>{
    b.onclick = ()=>{ state.bootyCal = b.dataset.cal; render(); };
  });

  document.querySelectorAll("#dayPills .pill").forEach(b=>{
    b.onclick = ()=>{ state.bootyDay = b.dataset.day; render(); };
  });
  const dayDoneBox = document.getElementById("dayDoneBox");
  if(dayDoneBox) dayDoneBox.onchange = ()=> setDayDone(parseInt(dayDoneBox.dataset.week,10), dayDoneBox.dataset.day, dayDoneBox.checked);

  document.querySelectorAll(".wInput").forEach(inp=>{
    inp.oninput = ()=>{
      const row = inp.closest(".exrow");
      setExValue(row.dataset.key, parseInt(row.dataset.week,10), inp.dataset.field, parseInt(inp.dataset.setidx,10), inp.value);
    };
  });
  document.querySelectorAll(".histbtn").forEach(btn=>{
    btn.onclick = ()=>{
      const panel = btn.closest(".exrow").querySelector(".histpanel");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    };
  });
  document.querySelectorAll(".pickrow .pickbtn").forEach(btn=>{
    btn.onclick = ()=>{
      const row = btn.closest(".pickrow");
      const key = row.dataset.pickkey;
      setPick(key, btn.dataset.opt);
      render();
    };
  });

  // Core
  document.querySelectorAll("#phasePills .pill").forEach(b=>{
    b.onclick = ()=>{ state.corePhase = b.dataset.phase; state.coreWeek = 1; state.coreDay = "Mon"; render(); };
  });
  document.querySelectorAll(".gridbox").forEach(cb=>{
    cb.onchange = ()=> setCoreGridCell(cb.dataset.phase, cb.dataset.week, cb.dataset.day, cb.dataset.field, cb.checked);
  });
  document.querySelectorAll("#coreWeekPills .pill").forEach(b=>{
    b.onclick = ()=>{ state.coreWeek = parseInt(b.dataset.coreweek,10); render(); };
  });
  document.querySelectorAll("#coreDayPills .pill").forEach(b=>{
    b.onclick = ()=>{ state.coreDay = b.dataset.coreday; render(); };
  });
  const coreDoneC = document.getElementById("coreDoneC");
  if(coreDoneC) coreDoneC.onchange = ()=> setCoreGridCell(state.corePhase, state.coreWeek, state.coreDay, "C", coreDoneC.checked);
  const coreDoneM = document.getElementById("coreDoneM");
  if(coreDoneM) coreDoneM.onchange = ()=> setCoreGridCell(state.corePhase, state.coreWeek, state.coreDay, "M", coreDoneM.checked);
  const blockOverride = document.getElementById("blockOverride");
  if(blockOverride) blockOverride.onchange = ()=>{
    setCoreBlockOverride(state.corePhase, state.coreWeek, state.coreDay, blockOverride.value);
    render();
  };
  const refreshBtn = document.getElementById("refreshBtn");
  if(refreshBtn) refreshBtn.onclick = async ()=>{ refreshBtn.textContent = "⟳ …"; await loadAllData(); render(); };
}

document.querySelectorAll(".section-toggle button").forEach(b=>{
  b.onclick = ()=>{ state.section = b.dataset.section; render(); };
});

// initial load, then periodic + focus-triggered re-sync so both phones stay current
(async ()=>{
  render(); // shows loading state
  await loadAllData();
  render();
})();

document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible"){ await loadAllData(); render(true); }
});
</script>
</body>
</html>
